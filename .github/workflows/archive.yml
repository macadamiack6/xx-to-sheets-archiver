name: Archive X to Google Sheets

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates libxml2-dev libxslt1-dev
          sudo update-ca-certificates

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run archiver (multi accounts)
        env:
          SHEETS_WEBHOOK_URL: ${{ secrets.SHEETS_WEBHOOK_URL }}
          SHEETS_WEBHOOK_TOKEN: ${{ secrets.SHEETS_WEBHOOK_TOKEN }}
          X_USERNAME: ${{ secrets.X_USERNAME }}
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
          REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
        run: |
          echo "RAW_X_USERNAME=${X_USERNAME}"

          python - <<'PY'
          import os, re, subprocess, sys

          raw = os.environ.get("X_USERNAME", "")
          users = [u.strip().lstrip("@") for u in re.split(r"[,\n]+", raw) if u.strip()]

          print("PARSED_USERS:", users)

          for u in users:
              print("==> Fetching:", u)
              env = os.environ.copy()
              env["X_USERNAME"] = u
              r = subprocess.run([sys.executable, "run.py"], env=env)
              if r.returncode != 0:
                  raise SystemExit(r.returncode)
          PY

      # 60일 비활성화 방지용 heartbeat
      - name: Heartbeat (daily)
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import pathlib
          p = pathlib.Path("heartbeat.txt")
          today = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          old = p.read_text().strip() if p.exists() else ""
          if old != today:
              p.write_text(today)
              print("UPDATED")
          else:
              print("NOCHANGE")
          PY

      - name: Commit heartbeat if changed
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add heartbeat.txt
          git commit -m "chore: heartbeat"
          git push
